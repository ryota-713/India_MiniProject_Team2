[project]
name = "ai-assisted-request-detection"
version = "0.1.0"
description = "Local educational hybrid detection dashboard for sanitized web request events"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "FURB"]